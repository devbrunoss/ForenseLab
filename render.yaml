services:
  - type: web
    name: forenselab-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: STORAGE_DIR
        value: /tmp/forenselab-evidence
      - key: DATABASE_URL
        value: sqlite:////tmp/forenselab.db
      - key: CORS_ORIGINS
        value: http://localhost:5173

  - type: static
    name: forenselab-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: forenselab-api
          property: host
      - key: VITE_DEMO_MODE
        value: "true"
