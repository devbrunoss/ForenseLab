[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="forenselab"
version="1.0.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.110","uvicorn[standard]>=0.27","sqlalchemy>=2.0","python-multipart>=0.0.9"]
[project.optional-dependencies]
dev=["pytest>=8","httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
